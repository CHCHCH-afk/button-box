# Load the normal ALSA configuration, then add an application-only volume stage.
</usr/share/alsa/alsa.conf>
pcm.messagebox_volume {
    type plug
    slave.pcm {
        type softvol
        slave.pcm {
            @func getenv
            vars [ MSGBOX_SPK_DEV ]
            default "plughw:CARD=Device,DEV=0"
        }
        control {
            name "MessageBox"
            card {
                @func getenv
                vars [ MSGBOX_SPEAKER_CARD ]
                default "Device"
            }
        }
        min_dB -40.0
        max_dB 0.0
        resolution 101
    }
}
